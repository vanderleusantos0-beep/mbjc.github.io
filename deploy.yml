name: Deploy Website to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Führt den Bot automatisch alle 15 Minuten aus, um Live-Daten aktuell zu halten
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci

      # 1. BOT AUSFÜHREN: Aktualisiert stats.json
      - name: Live Stats & Owner abrufen
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          GH_REPO_OWNER_AND_NAME: ${{ github.repository }}
        run: node index.js

      # 2. PROJEKT BAUEN & BEREITSTELLEN
      - name: Build / Output vorbereiten
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r public dist/ || true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
