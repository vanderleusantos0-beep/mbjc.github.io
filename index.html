<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Server Community</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- React & Babel für In-Browser Rendering -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const KONFIGURATION = {
      serverName: "Nexus Community",
      tagline: "Deine ultimative Community für Gaming & Development",
      description: "Willkommen auf unserem Server! Tausche dich aus, finde Mitspieler und nimm an unseren wöchentlichen Events teil.",
      inviteUrl: "https://discord.gg/dein-code", // <-- DEIN INVITE LINK
      logoUrl: "https://cdn.discordapp.com/embed/avatars/0.png"
    };

    function App() {
      const [stats, setStats] = React.useState({
        members: 0,
        online: 0,
        bots: 0,
        status: "offline",
        updatedAt: null
      });
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        // Lade Live-Daten aus public/stats.json
        fetch('./public/stats.json?t=' + Date.now())
          .then(res => res.json())
          .then(data => {
            setStats(data);
            setLoading(false);
          })
          .catch(err => {
            console.log("Keine stats.json gefunden, nutze Standardwerte", err);
            setLoading(false);
          });
      }, []);

      return (
        <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6">
          {/* Header Banner */}
          <div className="max-w-3xl w-full bg-slate-800/80 border border-slate-700/50 rounded-2xl p-8 shadow-2xl backdrop-blur-md text-center">
            
            <img 
              src={KONFIGURATION.logoUrl} 
              alt="Logo" 
              className="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-indigo-500 shadow-lg"
            />
            
            <h1 className="text-4xl font-extrabold tracking-tight text-white mb-2">
              {KONFIGURATION.serverName}
            </h1>
            
            <p className="text-indigo-400 font-medium mb-4">{KONFIGURATION.tagline}</p>
            <p className="text-slate-300 mb-8 max-w-xl mx-auto">{KONFIGURATION.description}</p>

            {/* Main CTA Button */}
            <a 
              href={KONFIGURATION.inviteUrl} 
              target="_blank" 
              rel="noreferrer"
              className="inline-flex items-center gap-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-8 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30 transform hover:-translate-y-0.5"
            >
              <i className="fa-brands fa-discord text-2xl"></i>
              <span>Discord beitreten</span>
            </a>

            {/* Server Live Stats Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-10">
              <div className="bg-slate-900/60 border border-slate-700/40 p-4 rounded-xl">
                <p className="text-xs text-slate-400 uppercase font-semibold">Mitglieder</p>
                <p className="text-2xl font-bold text-white mt-1">
                  {loading ? "..." : stats.members || 0}
                </p>
              </div>

              <div className="bg-slate-900/60 border border-slate-700/40 p-4 rounded-xl">
                <p className="text-xs text-slate-400 uppercase font-semibold">Online</p>
                <p className="text-2xl font-bold text-emerald-400 mt-1">
                  {loading ? "..." : stats.online || 0}
                </p>
              </div>

              <div className="bg-slate-900/60 border border-slate-700/40 p-4 rounded-xl">
                <p className="text-xs text-slate-400 uppercase font-semibold">Bots</p>
                <p className="text-2xl font-bold text-indigo-400 mt-1">
                  {loading ? "..." : stats.bots || 0}
                </p>
              </div>
            </div>

            {stats.updatedAt && (
              <p className="text-xs text-slate-500 mt-6">
                Zuletzt aktualisiert: {new Date(stats.updatedAt).toLocaleString("de-DE")}
              </p>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
