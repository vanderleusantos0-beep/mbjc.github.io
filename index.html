<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBJC Community | Offizielle Webseite & Bot-API Portal</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.08); }
    }

    .animate-fade-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    body {
      background: radial-gradient(circle at 50% -10%, #1e1b4b, #090d16 65%, #030712);
      color: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .liquid-glass {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.12);
    }

    .liquid-card {
      background: rgba(30, 41, 59, 0.45);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .liquid-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 16px 32px -8px rgba(99, 102, 241, 0.2);
    }

    .glow-orb {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
      animation: pulseGlow 8s ease-in-out infinite;
    }
  </style>
</head>
<body class="relative flex flex-col items-center justify-between p-3 md:p-8 min-h-screen">

  <div class="glow-orb top-0 left-1/2 -translate-x-1/2"></div>

  <div id="root" class="w-full max-w-6xl z-10"></div>

  <script type="text/babel">
    const CONFIG = {
      serverName: "MBJC Community",
      tagline: "Deine Heimat für Gaming, Development & Network",
      inviteUrl: "https://discord.gg/2Nuwdyr4tZ",
      websiteUrl: "http://mbjc.info/",
      ticketSiteUrl: "http://ticket.mbjc.info/",
      logoUrl: "https://cdn.discordapp.com/embed/avatars/0.png",
      discordWebhookUrl: "https://discord.com/api/webhooks/1555978021658304603/9k2e0F2T5hQlDCiZJDlIU_PDOibfDTWzoL4uT9q94snC6iCM7OLLJo9UkJmkONU1zxx6",
      
      // HIER DIE API-URL DEINES DISCORD BOTS EINTRAGEN (z.B. dein Node.js / Python Bot Server)
      botApiUrl: "https://dein-bot-api-server.com"
    };

    function App() {
      const [stats, setStats] = React.useState({ members: 0, online: 0, bots: 0, owners: [], updatedAt: null });
      const [loading, setLoading] = React.useState(true);
      const [showNotice, setShowNotice] = React.useState(true);
      
      const [view, setView] = React.useState('public');
      const [adminTab, setAdminTab] = React.useState('dashboard');
      const [loginStep, setLoginStep] = React.useState(1);
      const [usernameInput, setUsernameInput] = React.useState('');
      const [twoFactorCode, setTwoFactorCode] = React.useState('');
      const [generatedCode, setGeneratedCode] = React.useState('');
      const [authError, setAuthError] = React.useState('');
      const [authSuccess, setAuthSuccess] = React.useState('');
      const [currentUser, setCurrentUser] = React.useState(null);

      // Daten, die direkt vom Bot/API geladen werden können
      const [siteConfig, setSiteConfig] = React.useState({
        serverName: CONFIG.serverName,
        tagline: CONFIG.tagline,
        inviteUrl: CONFIG.inviteUrl,
        description: "Willkommen auf unserem Community-Server.",
        logoUrl: CONFIG.logoUrl
      });

      const [visitorsCount, setVisitorsCount] = React.useState(1420);
      const [discordClicks, setDiscordClicks] = React.useState(384);
      
      const [allowedUsers, setAllowedUsers] = React.useState([
        { id: '1', username: 'owner_1', role: 'Owner', status: 'Aktiv', addedAt: '2026-01-10' }
      ]);
      const [announcements, setAnnouncements] = React.useState([]);
      const [events, setEvents] = React.useState([]);
      const [auditLogs, setAuditLogs] = React.useState([]);

      // Formular-States
      const [newAdminUser, setNewAdminUser] = React.useState('');
      const [newAdminRole, setNewAdminRole] = React.useState('Moderator');
      const [annTitle, setAnnTitle] = React.useState('');
      const [annContent, setAnnContent] = React.useState('');
      const [evTitle, setEvTitle] = React.useState('');
      const [evDesc, setEvDesc] = React.useState('');
      const [evDate, setEvDate] = React.useState('');
      const [evLink, setEvLink] = React.useState(CONFIG.inviteUrl);

      // Daten beim Start vom Bot abrufen (Falls Bot API aktiv ist)
      React.useEffect(() => {
        fetch('./public/stats.json?t=' + Date.now())
          .then(res => res.json())
          .then(data => { setStats(data); setLoading(false); })
          .catch(() => setLoading(false));

        // Beispiel für Bot-API Abruf von Ankündigungen & Events
        /*
        fetch(`${CONFIG.botApiUrl}/api/data`)
          .then(res => res.json())
          .then(data => {
            if(data.announcements) setAnnouncements(data.announcements);
            if(data.events) setEvents(data.events);
          }).catch(err => console.log("Bot API offline, verwende lokalen Fallback"));
        */
      }, []);

      // Funktion zum Senden von Aktionen an die Bot-API
      const sendActionToBot = async (endpoint, payload) => {
        try {
          const response = await fetch(`${CONFIG.botApiUrl}/api/${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          return await response.json();
        } catch (err) {
          console.error("Bot API Fehler:", err);
          return null;
        }
      };

      const logAction = (adminName, actionDesc) => {
        const newLog = {
          id: Date.now().toString(),
          admin: adminName,
          action: actionDesc,
          timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19)
        };
        setAuditLogs([newLog, ...auditLogs]);
      };

      const handleRequest2FA = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthSuccess('');

        const cleanUsername = usernameInput.trim().toLowerCase();
        const userEntry = allowedUsers.find(u => u.username.toLowerCase() === cleanUsername);

        if (!userEntry) {
          setAuthError('Zugriff verweigert: Benutzer ist kein Admin.');
          return;
        }

        const secureCode = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedCode(secureCode);

        try {
          await fetch(CONFIG.discordWebhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              embeds: [{
                title: "🔐 MBJC Admin 2FA Code",
                description: `Admin **@${usernameInput}** fordert Login-Zugriff an.`,
                color: 65280,
                fields: [{ name: "Sicherheitscode", value: `\`\`\`${secureCode}\`\`\`` }]
              }]
            })
          });
          setAuthSuccess('2FA-Code wurde per Discord-Webhook versendet!');
          setLoginStep(2);
        } catch (err) {
          setAuthError('Fehler beim Senden des Webhooks.');
        }
      };

      const handleVerify2FA = (e) => {
        e.preventDefault();
        if (twoFactorCode !== generatedCode) {
          setAuthError('Ungültiger Sicherheitscode!');
          return;
        }
        const userObj = allowedUsers.find(u => u.username.toLowerCase() === usernameInput.toLowerCase().trim());
        setCurrentUser(userObj || { username: usernameInput, role: 'Admin' });
        setView('admin');
        setLoginStep(1);
        setTwoFactorCode('');
        setUsernameInput('');
        logAction(userObj.username, 'Erfolgreicher Login');
      };

      const handleDiscordClick = () => {
        setDiscordClicks(prev => prev + 1);
        window.open(siteConfig.inviteUrl, '_blank');
      };

      return (
        <div className="w-full flex flex-col items-center">
          
          <header className="w-full flex justify-between items-center mb-8 px-2">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('public')}>
              <img src={siteConfig.logoUrl} className="w-10 h-10 rounded-xl border border-white/10 object-cover" alt="Logo" />
              <span className="font-bold text-lg text-white tracking-wide">{siteConfig.serverName} Portal</span>
            </div>

            <div>
              {view === 'admin' ? (
                <button onClick={() => setView('public')} className="bg-rose-600/20 hover:bg-rose-600/40 border border-rose-500/40 text-rose-300 px-4 py-2 rounded-xl text-xs font-bold transition">
                  <i className="fa-solid fa-right-from-bracket mr-2"></i>Admin Verlassen
                </button>
              ) : (
                <button onClick={() => setView(view === 'login' ? 'public' : 'login')} className="bg-indigo-600/20 hover:bg-indigo-600/40 border border-indigo-500/40 text-indigo-300 px-4 py-2 rounded-xl text-xs font-bold transition">
                  <i className="fa-solid fa-shield-halved mr-2"></i>{view === 'login' ? 'Hauptseite' : 'Admin Login'}
                </button>
              )}
            </div>
          </header>

          {/* HAUPTSEITE */}
          {view === 'public' && (
            <div className="w-full animate-fade-in">
              <div className="liquid-glass rounded-3xl p-8 md:p-12 text-center w-full mb-10 relative overflow-hidden">
                <img src={siteConfig.logoUrl} alt="Logo" className="w-28 h-28 rounded-3xl mx-auto mb-6 border border-white/10 shadow-2xl object-cover" />
                <h1 className="text-4xl md:text-6xl font-black text-white mb-3">{siteConfig.serverName}</h1>
                <p className="text-slate-400 font-medium text-base mb-8 max-w-xl mx-auto">{siteConfig.tagline}</p>
                <button onClick={handleDiscordClick} className="inline-flex items-center justify-center gap-3 bg-gradient-to-r from-indigo-600 to-cyan-600 text-white font-bold py-4 px-8 rounded-2xl shadow-xl transition active:scale-95 cursor-pointer">
                  <i className="fa-brands fa-discord text-2xl"></i>
                  <span>Discord Server Beitreten</span>
                </button>
              </div>
            </div>
          )}

          {/* LOGIN */}
          {view === 'login' && (
            <div className="w-full max-w-md mx-auto my-12 animate-fade-in">
              <div className="liquid-glass rounded-3xl p-8 border border-indigo-500/30">
                <h2 className="text-2xl font-black text-white text-center mb-4">Admin 2FA Login</h2>
                {authError && <div className="mb-4 p-3 bg-rose-500/10 text-rose-300 text-xs rounded-xl">{authError}</div>}
                {authSuccess && <div className="mb-4 p-3 bg-emerald-500/10 text-emerald-300 text-xs rounded-xl">{authSuccess}</div>}
                
                {loginStep === 1 ? (
                  <form onSubmit={handleRequest2FA} className="space-y-4">
                    <input type="text" value={usernameInput} onChange={(e) => setUsernameInput(e.target.value)} placeholder="Discord Benutzername" className="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 px-4 text-sm text-white focus:outline-none" />
                    <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Code anfordern</button>
                  </form>
                ) : (
                  <form onSubmit={handleVerify2FA} className="space-y-4">
                    <input type="text" maxLength="6" value={twoFactorCode} onChange={(e) => setTwoFactorCode(e.target.value)} placeholder="123456" className="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 text-center font-mono text-lg text-white focus:outline-none" />
                    <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl">Einloggen</button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* ADMIN DASHBOARD */}
          {view === 'admin' && (
            <div className="w-full grid grid-cols-1 md:grid-cols-4 gap-6 animate-fade-in">
              <div className="liquid-glass rounded-3xl p-4 md:col-span-1 h-fit space-y-2">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                  { id: 'announcements', label: 'Ankündigungen', icon: 'fa-bullhorn' },
                  { id: 'events', label: 'Event-Manager', icon: 'fa-calendar-days' },
                  { id: 'audit', label: 'Bot-Protokoll', icon: 'fa-clipboard-list' }
                ].map(tab => (
                  <button key={tab.id} onClick={() => setAdminTab(tab.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-bold transition text-left ${adminTab === tab.id ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                    <i className={`fa-solid ${tab.icon} w-4`}></i><span>{tab.label}</span>
                  </button>
                ))}
              </div>

              <div className="md:col-span-3 space-y-6">
                {adminTab === 'dashboard' && (
                  <div className="liquid-glass rounded-3xl p-8">
                    <h2 className="text-2xl font-black text-white mb-2">Bot-API Dashboard</h2>
                    <p className="text-slate-400 text-xs">Verbunden mit Discord Bot Endpoint: <code className="text-indigo-400">{CONFIG.botApiUrl}</code></p>
                  </div>
                )}
                {/* Weitere Admin Tabs (Ankündigungen, Events, etc. senden Daten direkt an die Bot-API) */}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(command => document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
