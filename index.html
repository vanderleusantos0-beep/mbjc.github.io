<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Community - Official Live Landing Page</title>

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Modern Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & Babel standalone loader -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #070a12;
      color: #f8fafc;
      overflow-x: hidden;
    }

    /* Modern Ambient Background Glows */
    .glow-indigo {
      background: radial-gradient(circle, rgba(99, 102, 241, 0.28) 0%, rgba(0, 0, 0, 0) 70%);
    }
    .glow-purple {
      background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, rgba(0, 0, 0, 0) 70%);
    }
    .glow-emerald {
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
    }

    /* Glassmorphic UI Cards */
    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card-hover {
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card-hover:hover {
      transform: translateY(-6px);
      border-color: rgba(99, 102, 241, 0.45);
      box-shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.25);
    }

    /* Gradient Border Outline */
    .gradient-border {
      position: relative;
    }
    .gradient-border::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 1.25rem;
      padding: 1px;
      background: linear-gradient(135deg, rgba(99,102,241,0.5), rgba(168,85,247,0.3), rgba(255,255,255,0.05));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #070a12;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body class="antialiased text-slate-100 selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    /**
     * KONFIGURATION DER LANDINGPAGE
     * 
     * HINWEIS ZUR AUTOMATISCHEN DISCORD-ABFRAGE:
     * 1. Aktiviere auf deinem Discord-Server unter:
     *    Server-Einstellungen -> Widget -> "Server-Widget aktivieren" (Haken setzen)
     * 2. Kopiere die "Server-ID" aus den Widget-Einstellungen und trage sie unten bei `serverId` ein.
     * 3. Trage die Discord User-IDs der Owner ein. Die App fragt automatisch Status, Avatar & Aktivität ab!
     */
    const KONFIGURATION = {
      // Deines Discord Servers ID (WICHTIG für automatische Live-Abfrage):
      serverId: "1555249622920863804", // <-- DEINE DISCORD SERVER ID HIER EINTRAGEN
      
      serverName: "Nexus Community",
      tagline: "Deine ultimative Community für Gaming, Development & Esport",
      description: "Tritt unserem Discord bei! Finde Squad-Mitglieder, tausche dich mit Entwicklern aus und nimm an wöchentlichen Turnieren mit tollen Preisen teil.",
      inviteUrl: "https://discord.gg/dein-code", // <-- DEIN PROPER DISCORD INVITE LINK
      logoUrl: "https://api.dicebear.com/7.x/identicon/svg?seed=NexusServerLogo",

      // Liste der Server Owner / Management Team (wird durch Live-Daten aus dem Widget angereichert!)
      owners: [
        {
          discordId: "987654321012345678", // <-- Discord User ID des Owners
          fallbackName: "Alex 'Nexus'",
          role: "Server Founder & Lead Dev",
          badge: "Gründer",
          bio: "Leitet das Nexus Network. Programmiert Custom-Discord Bots & organisiert Turniere.",
          fallbackAvatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250",
          discordTag: "nexus.dev",
          githubUrl: "https://github.com",
          twitterUrl: "https://twitter.com"
        },
        {
          discordId: "876543210987654321", // <-- Discord User ID des Co-Owners
          fallbackName: "Elena 'Nyx'",
          role: "Co-Owner & Community Lead",
          badge: "Co-Owner",
          bio: "Zuständig für Moderation, Community-Events & Partnerschaften. Immer für ein Match zu haben!",
          fallbackAvatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&q=80&w=250",
          discordTag: "nyx_gaming",
          githubUrl: "",
          twitterUrl: "https://twitter.com"
        }
      ],

      // Feature-Karten auf der Website
      features: [
        {
          icon: "fa-solid fa-gamepad",
          title: "Aktives Matchmaking",
          description: "Finde rund um die Uhr Mitspieler für Valorant, League of Legends, Apex, GTA RP und mehr."
        },
        {
          icon: "fa-solid fa-code",
          title: "Dev & Tech Corner",
          description: "Erhalte direkte Hilfe bei Programmierung, Webdesign, Bots und technischen Problemen."
        },
        {
          icon: "fa-solid fa-trophy",
          title: "Turniere & Giveaways",
          description: "Nimm an regelmäßigen Community-Events teil und gewinne Discord Nitro, Games & Merch."
        },
        {
          icon: "fa-solid fa-microphone",
          title: "High-FPS Voice Channels",
          description: "Strukturierte Voice-Channels mit 384kbps Audio-Qualität und Musik-Bots."
        }
      ]
    };

    function App() {
      // Live-Statistiken vom Server
      const [serverData, setServerData] = React.useState({
        name: KONFIGURATION.serverName,
        instantInvite: KONFIGURATION.inviteUrl,
        presenceCount: 184, // Fallback Online-Wert
        membersCount: 850,  // Schätzwert/Fallback
        channelsCount: 24,
        isLive: false
      });

      // Gemappte Owner-Daten (Kombination aus Config + Live Discord Widget Data)
      const [ownerList, setOwnerList] = React.useState(KONFIGURATION.owners);
      const [loading, setLoading] = React.useState(true);
      const [copiedTag, setCopiedTag] = React.useState(null);

      React.useEffect(() => {
        const fetchDiscordWidgetData = async () => {
          try {
            // Discord Widget API Endpoint
            const response = await fetch(`https://discord.com/api/guilds/${KONFIGURATION.serverId}/widget.json`);
            
            if (!response.ok) {
              throw new Error("Discord Widget nicht erreichbar oder deaktiviert.");
            }

            const widgetData = await response.json();
            
            // Server Grunddaten aktualisieren
            setServerData(prev => ({
              ...prev,
              name: widgetData.name || prev.name,
              instantInvite: widgetData.instant_invite || prev.instantInvite,
              presenceCount: widgetData.presence_count || prev.presenceCount,
              channelsCount: widgetData.channels ? widgetData.channels.length : prev.channelsCount,
              isLive: true
            }));

            // Prüfen, ob die Mitgliederliste aus dem Widget vorhanden ist
            if (widgetData.members && Array.isArray(widgetData.members)) {
              const liveMembers = widgetData.members;

              // Abgleich der Owner mit den echten Live-Daten aus dem Discord Widget
              const updatedOwners = KONFIGURATION.owners.map(owner => {
                const matchedDiscordUser = liveMembers.find(m => m.id === owner.discordId);

                if (matchedDiscordUser) {
                  return {
                    ...owner,
                    name: matchedDiscordUser.username || owner.fallbackName,
                    avatarUrl: matchedDiscordUser.avatar_url || owner.fallbackAvatar,
                    status: matchedDiscordUser.status || "online", // online, idle, dnd, suppress
                    gameActivity: matchedDiscordUser.game ? matchedDiscordUser.game.name : null,
                    isLiveFromDiscord: true
                  };
                }

                // Falls der User nicht im Widget ist (z.B. offline)
                return {
                  ...owner,
                  name: owner.fallbackName,
                  avatarUrl: owner.fallbackAvatar,
                  status: "offline",
                  gameActivity: null,
                  isLiveFromDiscord: false
                };
              });

              setOwnerList(updatedOwners);
            }
          } catch (error) {
            console.warn("Hinweis zur Discord API:", error.message);
            // Fallback auf Standard-Beispieldaten setzen
            setOwnerList(KONFIGURATION.owners.map(o => ({
              ...o,
              name: o.fallbackName,
              avatarUrl: o.fallbackAvatar,
              status: "online",
              gameActivity: "Developing Discord Bot...",
              isLiveFromDiscord: false
            })));
          } finally {
            setLoading(false);
          }
        };

        fetchDiscordWidgetData();
        // Alle 30 Sekunden automatisch aktualisieren
        const interval = setInterval(fetchDiscordWidgetData, 30000);
        return () => clearInterval(interval);
      }, []);

      // Hilfsfunktion zum Kopieren von Discord-Tags
      const copyToClipboard = (text, id) => {
        const tempInput = document.createElement("input");
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);

        setCopiedTag(id);
        setTimeout(() => setCopiedTag(null), 2200);
      };

      // Styling für Live-Statuspunkte
      const getStatusBadgeStyle = (status) => {
        switch(status) {
          case 'online': 
            return { color: 'bg-emerald-500 shadow-emerald-500/50', text: 'Online' };
          case 'idle': 
            return { color: 'bg-amber-500 shadow-amber-500/50', text: 'Abwesend' };
          case 'dnd': 
            return { color: 'bg-rose-500 shadow-rose-500/50', text: 'Bitte nicht stören' };
          default: 
            return { color: 'bg-slate-500 shadow-slate-500/30', text: 'Offline' };
        }
      };

      return (
        <div className="relative min-h-screen flex flex-col items-center justify-between overflow-hidden">
          
          {/* Neon Glow Spots Background */}
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[900px] h-[450px] glow-indigo opacity-70 blur-3xl pointer-events-none"></div>
          <div className="absolute top-1/3 -right-20 w-[600px] h-[400px] glow-purple opacity-40 blur-3xl pointer-events-none"></div>
          <div className="absolute bottom-10 -left-20 w-[600px] h-[400px] glow-emerald opacity-30 blur-3xl pointer-events-none"></div>

          {/* Navigation Bar */}
          <header className="w-full max-w-6xl px-6 py-6 flex items-center justify-between z-20">
            <div className="flex items-center gap-3">
              <img 
                src={KONFIGURATION.logoUrl} 
                alt="Server Logo" 
                className="w-10 h-10 rounded-xl bg-slate-800/80 p-1 border border-indigo-500/30 shadow-lg shadow-indigo-500/10"
              />
              <span className="font-extrabold text-lg tracking-wide text-white">{serverData.name}</span>
            </div>

            <a 
              href={serverData.instantInvite}
              target="_blank"
              rel="noreferrer"
              className="inline-flex items-center gap-2 px-5 py-2.5 text-xs sm:text-sm font-semibold text-slate-200 bg-slate-800/80 hover:bg-indigo-600/90 border border-slate-700/60 hover:border-indigo-500/50 rounded-xl transition-all duration-300 shadow-md hover:shadow-indigo-500/25"
            >
              <i className="fa-brands fa-discord text-indigo-400 group-hover:text-white"></i>
              <span>Server Beitreten</span>
            </a>
          </header>

          {/* Main Content Area */}
          <main className="w-full max-w-5xl px-4 sm:px-6 py-6 flex flex-col items-center z-10">
            
            {/* HERO HERO BANNER CARD */}
            <div className="gradient-border w-full glass-card p-8 sm:p-12 shadow-2xl text-center relative overflow-hidden mb-12">
              
              {/* Live Discord Status Indicator Pill */}
              <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-900/80 border border-indigo-500/30 text-indigo-300 text-xs font-semibold mb-6 shadow-inner">
                <span className="relative flex h-2.5 w-2.5">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                <span>{serverData.isLive ? "Live API Verbunden" : "Offizielle Discord Community"}</span>
              </div>

              {/* Title & Tagline */}
              <h1 className="text-4xl sm:text-6xl font-black tracking-tight text-white mb-4 leading-tight">
                {serverData.name}
              </h1>
              
              <p className="text-lg sm:text-xl font-medium text-indigo-300 mb-6 max-w-2xl mx-auto">
                {KONFIGURATION.tagline}
              </p>
              
              <p className="text-slate-400 text-sm sm:text-base mb-8 max-w-2xl mx-auto leading-relaxed">
                {KONFIGURATION.description}
              </p>

              {/* Main Discord Call-To-Action Button */}
              <div className="flex flex-col sm:flex-row gap-4 justify-center items-center mb-10">
                <a 
                  href={serverData.instantInvite} 
                  target="_blank" 
                  rel="noreferrer"
                  className="w-full sm:w-auto inline-flex items-center justify-center gap-3 bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-4 px-10 rounded-2xl transition duration-300 shadow-lg shadow-indigo-600/35 transform hover:-translate-y-1 active:translate-y-0"
                >
                  <i className="fa-brands fa-discord text-2xl"></i>
                  <span className="text-base tracking-wide">Jetzt Discord Beitreten</span>
                </a>
              </div>

              {/* Live Server Stats Cards */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-8 border-t border-slate-800/80">
                
                {/* Online Members Live Counter */}
                <div className="bg-slate-900/60 border border-slate-800/80 p-4 rounded-xl flex items-center justify-between group hover:border-emerald-500/40 transition">
                  <div className="text-left">
                    <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">Online Jetzt</p>
                    <p className="text-2xl font-extrabold text-emerald-400 mt-1 flex items-center gap-2">
                      {loading ? <i className="fa-solid fa-spinner animate-spin text-sm"></i> : serverData.presenceCount.toLocaleString()}
                    </p>
                  </div>
                  <div className="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 group-hover:scale-110 transition-transform">
                    <i className="fa-solid fa-user-check text-lg animate-pulse"></i>
                  </div>
                </div>

                {/* Server Channels Stats */}
                <div className="bg-slate-900/60 border border-slate-800/80 p-4 rounded-xl flex items-center justify-between group hover:border-indigo-500/40 transition">
                  <div className="text-left">
                    <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">Voice & Text</p>
                    <p className="text-2xl font-extrabold text-indigo-400 mt-1">
                      {loading ? <i className="fa-solid fa-spinner animate-spin text-sm"></i> : `${serverData.channelsCount}+ Channels`}
                    </p>
                  </div>
                  <div className="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 group-hover:scale-110 transition-transform">
                    <i className="fa-solid fa-hashtag text-lg"></i>
                  </div>
                </div>

                {/* Security & Quality Indicator */}
                <div className="bg-slate-900/60 border border-slate-800/80 p-4 rounded-xl flex items-center justify-between group hover:border-purple-500/40 transition">
                  <div className="text-left">
                    <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">Community Status</p>
                    <p className="text-2xl font-extrabold text-purple-400 mt-1">Verifiziert</p>
                  </div>
                  <div className="w-12 h-12 rounded-xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400 group-hover:scale-110 transition-transform">
                    <i className="fa-solid fa-shield-halved text-lg"></i>
                  </div>
                </div>

              </div>

            </div>

            {/* SERVER OWNERS & TEAM SECTION */}
            <div className="w-full mb-16">
              <div className="text-center mb-8">
                <h2 className="text-2xl sm:text-3xl font-extrabold text-white flex items-center justify-center gap-2">
                  <i className="fa-solid fa-crown text-amber-400 text-xl"></i>
                  <span>Server Leitung & Owners</span>
                </h2>
                <p className="text-slate-400 text-sm mt-1">
                  Live Status-Abfrage via Discord API für das Gründer-Team
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {ownerList.map((owner, idx) => {
                  const statusStyle = getStatusBadgeStyle(owner.status);
                  return (
                    <div 
                      key={owner.discordId || idx} 
                      className="glass-card glass-card-hover p-6 rounded-2xl relative flex flex-col justify-between overflow-hidden"
                    >
                      {/* Top Header: Avatar + Badge */}
                      <div className="flex items-start justify-between mb-4">
                        <div className="relative">
                          <img 
                            src={owner.avatarUrl} 
                            alt={owner.name} 
                            className="w-20 h-20 rounded-2xl object-cover border-2 border-slate-700 shadow-md bg-slate-900"
                            onError={(e) => { e.target.src = owner.fallbackAvatar; }}
                          />
                          {/* Live Discord Status Circle Dot */}
                          <div 
                            className={`absolute -bottom-1 -right-1 w-5 h-5 rounded-full border-2 border-slate-900 ${statusStyle.color} shadow-lg`} 
                            title={`Discord Status: ${statusStyle.text}`}
                          ></div>
                        </div>

                        <div className="flex flex-col items-end gap-1">
                          <div className="flex items-center gap-1.5 bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs px-3 py-1 rounded-full font-bold">
                            <i className="fa-solid fa-crown text-amber-400 text-xs"></i>
                            <span>{owner.badge}</span>
                          </div>
                          
                          {owner.isLiveFromDiscord && (
                            <span className="text-[10px] text-emerald-400 flex items-center gap-1 font-mono">
                              <i className="fa-solid fa-wifi text-[9px]"></i> Live Sync
                            </span>
                          )}
                        </div>
                      </div>

                      {/* Owner Description & Info */}
                      <div className="mb-4">
                        <h3 className="text-xl font-bold text-white flex items-center gap-2">
                          {owner.name}
                        </h3>
                        <p className="text-indigo-400 text-sm font-semibold mb-2">{owner.role}</p>
                        <p className="text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">
                          {owner.bio}
                        </p>

                        {/* Playing Activity / Custom Status from Discord */}
                        {owner.gameActivity && (
                          <div className="bg-slate-900/80 px-3 py-2 rounded-lg border border-slate-800 text-xs text-indigo-300 flex items-center gap-2">
                            <i className="fa-solid fa-gamepad text-indigo-400"></i>
                            <span className="truncate">Spielt / Aktivität: <strong>{owner.gameActivity}</strong></span>
                          </div>
                        )}
                      </div>

                      {/* Discord Copy Tag & Social Links */}
                      <div className="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs">
                        <button 
                          onClick={() => copyToClipboard(owner.discordTag, owner.discordId || idx)}
                          className="flex items-center gap-2 bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 px-3.5 py-1.5 rounded-xl border border-slate-700/50 transition-all active:scale-95"
                          title="Discord Username kopieren"
                        >
                          <i className="fa-brands fa-discord text-indigo-400"></i>
                          <span className="font-mono text-xs">{copiedTag === (owner.discordId || idx) ? "Kopiert!" : owner.discordTag}</span>
                          <i className={`fa-solid ${copiedTag === (owner.discordId || idx) ? 'fa-check text-emerald-400' : 'fa-copy text-slate-500'} text-[10px]`}></i>
                        </button>

                        <div className="flex gap-2">
                          {owner.githubUrl && (
                            <a href={owner.githubUrl} target="_blank" rel="noreferrer" className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition">
                              <i className="fa-brands fa-github text-sm"></i>
                            </a>
                          )}
                          {owner.twitterUrl && (
                            <a href={owner.twitterUrl} target="_blank" rel="noreferrer" className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition">
                              <i className="fa-brands fa-x-twitter text-sm"></i>
                            </a>
                          )}
                        </div>
                      </div>

                    </div>
                  );
                })}
              </div>
            </div>

            {/* FEATURES GRID SECTION */}
            <div className="w-full mb-12">
              <div className="text-center mb-8">
                <h2 className="text-2xl sm:text-3xl font-extrabold text-white">Was dich auf unserem Server erwartet</h2>
                <p className="text-slate-400 text-sm mt-1">Die Highlights unserer Community auf einen Blick</p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                {KONFIGURATION.features.map((feature, idx) => (
                  <div key={idx} className="glass-card glass-card-hover p-6 rounded-2xl flex flex-col text-left">
                    <div className="w-12 h-12 rounded-xl bg-indigo-600/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 mb-4 text-xl">
                      <i className={feature.icon}></i>
                    </div>
                    <h3 className="text-lg font-bold text-white mb-2">{feature.title}</h3>
                    <p className="text-slate-400 text-xs sm:text-sm leading-relaxed">{feature.description}</p>
                  </div>
                ))}
              </div>
            </div>

          </main>

          {/* Footer Section */}
          <footer className="w-full border-t border-slate-800/80 bg-slate-950/60 py-8 px-6 text-center text-slate-500 text-xs z-10">
            <div className="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <p>© {new Date().getFullYear()} {serverData.name}. Alle Rechte vorbehalten.</p>
              <div className="flex items-center gap-4">
                <a href={serverData.instantInvite} target="_blank" rel="noreferrer" className="hover:text-slate-300 transition">Discord Support</a>
                <span>•</span>
                <span className="text-slate-600">Nicht mit Discord Inc. affiliiert</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // React App auf dem Root-DOM Element mounten
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
